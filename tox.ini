[tox]
envlist = py{39,310,311,312,313,314}
isolated_build = True
skip_missing_interpreters = True

[testenv]
description = Run all tests with {basepython}
deps =
    pytest>=7.0.0
    rpm
commands =
    pytest {posargs:tests/}

[testenv:lint]
description = Run linting checks
skip_install = True
deps =
    ruff>=0.1.0
commands =
    ruff check .

[testenv:format]
description = Auto-format code
skip_install = True
deps =
    ruff>=0.1.0
commands =
    ruff check --fix .
